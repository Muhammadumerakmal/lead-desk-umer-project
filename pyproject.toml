[project]
name = "lead-desk"
version = "0.1.0"
description = "Lead Desk: triages raw freelance client messages into a typed, actionable verdict."
requires-python = ">=3.13"
dependencies = [
    "openai-agents>=0.0.9",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.scripts]
lead-desk = "lead_desk.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
